[project]
name = "sift"
version = "0.1.0"
description = "Rank a pile of documents against weighted criteria, with dealbreakers as hard gates"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
typesafe = ["typesafe-sdk>=0.1"]
anthropic = ["anthropic>=0.40"]
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "pypdf>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "asgi-lifespan>=2.1",
    "mypy>=1.11",
    "ruff>=0.8",
]

[project.scripts]
sift = "sift.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
