services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sift
      POSTGRES_PASSWORD: sift
      POSTGRES_DB: sift
    ports:
      - "5433:5432"
    volumes:
      - sift-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sift -d sift"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  sift-db:
